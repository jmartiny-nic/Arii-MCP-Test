openapi: 3.0.3
info:
  title: Arii Health Platform API
  version: "2.0.0"
  x-mcp-tool-prefix: Arii_MCP
  description: |
    Arii is a health and wellness platform for patient data, clinical notes, observations,
    medications and supplements, journaling, meals, and symptoms.

    ## How to use these tools

    **Two kinds of user ID.** Every `userId` here is an **Arii user ID** (a v4 GUID,
    `UserDto.id`). It is never an Airia profile ID (v7), a Keycloak `sub`, or a group ID;
    those return 404 "No user found". The person whose record a question is about comes
    from execution context. `get_current_user` returns the **requester**, never the subject.

    **`requestingUserId`**, where a tool still requires it, is the caller's own Arii user ID.
    It is not the patient's ID. Under Bearer authentication the server resolves the caller
    from the session and ignores the value, so a wrong value does no harm, but the schema
    requires one.

    **Resolving a metric.** People say "my sugar", "my BP", "cholesterol". Call
    `bulk_search_marker_types` once with every metric named, then pass the returned marker
    type IDs as `specificMarkers`. An empty array for a keyword means the catalog has no
    such marker, not that the person has no data.

    **Numbers vs events.** Every numeric value, laboratory results included, is a marker
    sample: `get_marker_summary`, `get_marker_averages`, `get_marker_samples`. An
    observation is the event a value came from (a lab panel, a scan, a workout);
    `list_observations` and `get_observation` describe the event and do not carry values.
    `get_observation_samples` is the one read that returns the reference range that
    applies to this patient.

    **Dates.** Marker, meal and observation-sample reads take local calendar dates
    `yyyy-MM-dd` as `recordStartDate`/`recordEndDate`, both required together. Symptom and
    journal reads take UTC instants with a trailing `Z`; a bare date returns 400.

    **Failures.** If a read fails, say you could not retrieve the data. A failure is never
    evidence that the person has none. A refused cross-user read today may surface as 403,
    400 or 500 depending on the endpoint; all of them mean "could not read", not "empty".

    **Writes.** No tool here writes. The app writes a record when the person approves a card.

servers:
  - url: https://dev.api.nicoya.health
    description: Nicoya dev environment (override per environment via ?u= on the gateway URL)

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: Users
    description: Identity and profile of the requester and of patients
  - name: Journal
    description: Patient wellness journal entries
  - name: Meals
    description: Meal and nutrition tracking
  - name: Medications
    description: Medications and supplements, dose history and adherence
  - name: Notes
    description: Clinical and provider notes for patients
  - name: Observations
    description: Health observations (labs, activities, assessments, appointments, summaries) and their raw samples
  - name: Documents
    description: Health documents with AI-powered feature extraction
  - name: Symptoms
    description: Symptom tracking and reporting
  - name: Markers
    description: Health marker summaries, averages, and raw samples (aggregated health data)
  - name: MarkerTypes
    description: Marker type (biomarker/metric) definitions and lookup
  - name: DataDictionary
    description: Per-user data dictionary (which marker types a user has data for)

paths:
  # ===================
  # USER ENDPOINTS
  # ===================
  /api/v1/Users/me:
    get:
      tags: [Users]
      operationId: get_current_user
      summary: Get the authenticated caller's own identity
      description: |
        Returns the person making the request: their Arii user ID (`id`), `airiaProfileId`,
        `email`, `firstName`, `lastName`, `isVerified` and `activeGroupId`.

        Use when the question is about the requester themselves, or to tell "this session
        has no linked Arii account" (this tool returns 404) apart from "this person has no
        data" when other reads come back empty.

        **Do not use the returned `id` as the `userId` for a patient data read.** For a
        clinician, that would read the clinician's own record instead of the patient's and
        report that the patient has no data. The patient's ID comes from execution context.

        This is not a required first call, and it says nothing about what data exists.
        The returned `id` is the value to send as `requestingUserId` where a tool requires one.

        No parameters. 401 if unauthenticated; 404 if the session has no linked Arii account.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: Authenticated caller's Arii identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserIdentityDto"
        "401":
          description: Missing or invalid Bearer token
        "404":
          description: Valid token but no linked Arii user

  /api/v1/Users/{userId}:
    get:
      tags: [Users]
      operationId: get_user
      summary: Get a user's basic identity by Arii user ID
      description: |
        Returns basic identity information for a user: name, email, Airia profile ID, active
        group, avatar, and the last sync timestamp for Apple Health, Garmin and Health Connect.

        Use to confirm a user's name or email from a known user ID, or to check whether a
        device is still feeding data: a stale sync timestamp explains missing recent readings
        better than any marker read can.

        Does not return date of birth, sex, timezone, height, weight or allergies. Use
        `get_user_preferences` for those.

        `userId` must be an Arii user ID. An Airia profile ID returns 404.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "404":
          description: No user with that Arii ID, or an Airia profile ID was sent

  /api/v3/UserPreferences/{userId}:
    get:
      tags: [Users]
      operationId: get_user_preferences
      summary: Get a user's profile information and demographics
      description: |
        Returns a user's profile information: date of birth (`yyyy-MM-dd`), sex, timezone,
        height and weight with their units, allergies, dietary preferences, goals, preferred
        data source and unit system.

        Use for profile information, not measured health data. Answers "how old is she",
        "does he have allergies", "what timezone / units does this person use".

        On a permitted cross-user read, fields may be filtered by the requester's
        permissions. A missing field may therefore be hidden rather than unset.

        If no timezone was selected, `timeZoneIdentifier` defaults to `America/New_York`.
        Treat this as a default, not a user preference.

        Enum fields are integers: `sex` 0=Male, 1=Female, 2=Other. Prefer
        `preferredDataSourceName` over the numeric `preferredDataSource`.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
      responses:
        "200":
          description: User preferences and demographics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferencesDto"
        "403":
          description: Caller lacks permission to read this user's profile
        "404":
          description: No preferences exist for this user, or wrong ID kind

  # ===================
  # JOURNAL ENDPOINTS
  # ===================
  /api/v1/Journal/{userId}:
    get:
      tags: [Journal]
      operationId: get_user_journals
      summary: Get journal entries for a user
      description: |
        Returns journal entries written by a user over a date range, with title, content,
        image URLs and structured activity responses.

        Use for the user's own written account of how they were feeling or what they
        experienced, not for measured health data. Treat the content as the user's account;
        it may differ from measured data.

        Dates must be UTC timestamps such as `2026-08-28T00:00:00Z`. A bare calendar date
        returns 400. Filter on `date`, or on `startDate` and `endDate`.

        When no entries match, this returns 404 with a message, not an empty list. Read that
        as "no entries for the filter", not as an error.

        If this read fails for another reason, say you could not retrieve the data. A failure
        is never evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: date
          in: query
          description: Filter by one specific day. UTC timestamp with a trailing `Z`.
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Range start, inclusive. UTC timestamp with a trailing `Z`; a bare date returns 400.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Range end, inclusive. UTC timestamp with a trailing `Z`; a bare date returns 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalDto"
        "404":
          description: No journal entries matched the filter (message body, not an error envelope)

  /api/v1/Journal/journal/{journalId}:
    get:
      tags: [Journal]
      operationId: get_journal
      summary: Get one journal entry by ID
      description: |
        Returns one journal entry in full, including its body text.

        Use only with a journal ID returned by `get_user_journals`, when the user asks about
        a specific entry already identified in the conversation.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: journalId
          in: path
          required: true
          description: The journal entry ID (GUID) from `get_user_journals`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Journal entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDto"

  # ===================
  # MEAL ENDPOINTS
  # ===================
  /api/v1/Meals/{userId}:
    get:
      tags: [Meals]
      operationId: get_user_meals
      summary: Get meals recorded by a user
      description: |
        Returns meals recorded by a user over a date range, including their attached
        nutrition data, portion size and any co-eaters.

        Send `recordStartDate` and `recordEndDate` together as `yyyy-MM-dd`; they are the
        person's local calendar days. With this pair, no matching meals returns 200 with an
        empty list.

        The legacy `date` / `startDate` / `endDate` instants are still accepted. On that path
        no matching meals returns 404 with a message instead of an empty list; read it as
        "no meals for the filter", not as an error.

        An empty result does not mean the person did not eat. Dietary marker data can exist
        without meal records.

        If this read fails for another reason, say you could not retrieve the data. A failure
        is never evidence that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: recordStartDate
          in: query
          description: Local calendar start day (`yyyy-MM-dd`). Send together with recordEndDate. Preferred.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          description: Local calendar end day (`yyyy-MM-dd`). Send together with recordStartDate. Preferred.
          schema:
            type: string
            format: date
        - name: date
          in: query
          description: Legacy. One specific day as a UTC timestamp. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: startDate
          in: query
          description: Legacy. Range start as a UTC timestamp. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Legacy. Range end as a UTC timestamp. Prefer the record-date pair.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of meals (empty when none match on the record-date path)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealDto"
        "404":
          description: Legacy date path only. No meals matched the filter (message body)

  /api/v1/Meals/meal/{mealId}:
    get:
      tags: [Meals]
      operationId: get_meal
      summary: Get one meal by ID
      description: |
        Returns one meal in full, including its complete nutrition breakdown, image and
        associated users.

        Use only with a meal ID returned by `get_user_meals`, when the user asks about a
        specific meal already identified in the conversation.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: mealId
          in: path
          required: true
          description: The meal ID (GUID) from `get_user_meals`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Meal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDto"

  # ===================
  # MEDICATION AND SUPPLEMENT ENDPOINTS
  # ===================
  /api/v1/user-products/user/{userId}/active:
    get:
      tags: [Medications]
      operationId: get_active_medications_and_supplements
      summary: Get what a person is currently taking
      description: |
        Returns what a person is currently taking, medications and supplements together, one
        row per item: `displayName`, `formType`, strength, `doseQuantity`, `schedule`,
        `instructions`, `status` and today's dose logs in `todayHistory`.

        Use for the current medication or supplement list: "what am I on", "what do I take
        today", "am I still taking X".

        `type` is optional. Omit it for both categories, or pass `Medication` or `Supplement`
        for one. Omitting it does not default to medications.

        Returns only items active today. An item that is on hold, completed or stopped, or
        whose schedule has not started or has already ended, is not returned. For past items
        use `get_all_medications_and_supplements`.

        Strength is `strengthValue` with `strengthUnitCode`, a free-text unit code that can
        carry a concentration such as `mg/mL`. Always report the two together.

        `todayHistory` holds today's dose logs. An empty `todayHistory` does not mean nothing
        was scheduled: a day's logs exist only once the prescription was created or updated,
        so today's rows may not exist yet. For whether a dose was taken on an earlier day use
        `get_dose_history`.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/ProductTypeOptionalQuery"
      responses:
        "200":
          description: Items active today
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProductPrescriptionResponse"
        "403":
          description: Caller may not read this user's medications

  /api/v1/user-products/user/{userId}/prescriptions:
    get:
      tags: [Medications]
      operationId: get_all_medications_and_supplements
      summary: Get every medication or supplement on a person's record, current and past
      description: |
        Returns every medication or supplement on a person's record, current and past,
        whatever its status: `Active`, `OnHold`, `Completed`, `Stopped`, `Superseded` or
        `EnteredInError`, with `deactivatedAt` for anything no longer in use.

        Use for what someone used to take, when they stopped, or whether they have been on a
        drug before. For what they are taking now, use `get_active_medications_and_supplements`.

        `type` must always be sent. It accepts `Medication` or `Supplement`; omitting it
        returns medications only with a 200 and nothing saying supplements were left out. Call
        the tool twice when both categories are needed.

        Read `status` on every row. This tool returns discontinued and mistakenly entered items
        alongside current ones, so presenting the rows as a medication list would overstate
        what the person takes.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - name: type
          in: query
          required: true
          description: Which category to return. Always send it; omitting it silently returns medications only.
          schema:
            type: string
            enum: [Medication, Supplement]
      responses:
        "200":
          description: All prescriptions of the requested type, any status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProductPrescriptionResponse"
        "403":
          description: Caller may not read this user's medications

  /api/v1/user-products/user/{userId}/history:
    get:
      tags: [Medications]
      operationId: get_dose_history
      summary: Get scheduled doses grouped by day, with their status
      description: |
        Returns the individual scheduled doses of a person's medications and supplements,
        grouped by the day each dose was scheduled for (`logsByDate`), each with its status:
        `Pending`, `Taken`, `Skipped` or `Missed`.

        Use for adherence questions and to determine whether a dose was taken on a given day.

        This is not the current medication list; use `get_active_medications_and_supplements`
        for that. Its rows are `AdherenceLogResponse` (`displayName`, `productType`,
        `doseQuantity`, `strengthValue`, `strengthUnitCode`), not the legacy medication-row
        shape; for a row in the legacy shape use `get_medication_history`.

        `type` is optional. Omit it for both categories, or pass `Medication` or `Supplement`.

        Always send `startDate`. Without it the response reaches back to the person's first
        dose, unsorted and uncapped. `endDate` defaults to today in the person's own timezone.

        `dateFilterBy` defaults to `ScheduledDate`, which keeps each dose in the day it was
        due; `yyyy-MM-dd` is fine on that axis. Pass `EffectiveDate` to window taken doses by
        when they were actually taken; that axis compares against an instant, so send a UTC
        timestamp such as `2026-08-28T00:00:00Z` or the call returns 400.

        `Pending` means a dose is still due and `Missed` means it is past its grace period.
        The endpoint reconciles the two before answering, so both can be reported as read.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/ProductTypeOptionalQuery"
        - name: startDate
          in: query
          description: Window start. Always send it. `yyyy-MM-dd` on the default ScheduledDate axis; a UTC timestamp with `Z` on EffectiveDate.
          schema:
            type: string
        - name: endDate
          in: query
          description: Window end. Defaults to today in the person's timezone. Same format rules as startDate.
          schema:
            type: string
        - name: status
          in: query
          description: Optional filter to one dose status.
          schema:
            type: string
            enum: [Pending, Taken, Skipped, Missed]
        - name: dateFilterBy
          in: query
          description: Which date the window applies to. `ScheduledDate` (default) buckets by due day; `EffectiveDate` windows by when a dose was taken and needs UTC timestamps.
          schema:
            type: string
            enum: [ScheduledDate, EffectiveDate]
            default: ScheduledDate
      responses:
        "200":
          description: Doses grouped by scheduled day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "403":
          description: Caller may not read this user's medications

  /api/v1/user-products/user/{userId}/history/logs:
    get:
      tags: [Medications]
      operationId: get_medication_history
      summary: Get the flat dose log in the medication-row shape used by medication cards
      description: |
        Returns scheduled doses as a flat list in the legacy medication-row shape: each row
        carries `id` (the dose log ID), `medicationId`, `medicationName`, `medicationType`,
        `doseValue`, `doseUnit`, `strengthUnitCode`, `scheduledDate`, `scheduledTime`,
        `status` (`Pending`, `Taken` or `Skipped`), `takenAt`, `scheduleType`, `isActive`,
        `instructions` and the `schedule`.

        Use it when a medication card (`<AriiMedicine>`) must be built from a real row: every
        card field comes from this response and nothing else. For a day-by-day adherence view
        prefer `get_dose_history`; for the current list use
        `get_active_medications_and_supplements`.

        This is the adherence log, not the current medication list: one row per scheduled
        dose, and only for items that already have dose logs in the window.

        `type` is required: `Medication` or `Supplement`. `requestingUserId` is required and is
        the caller's own Arii user ID from `get_current_user`, never the patient's.

        Always send `startDate` and `endDate` as UTC timestamps with a trailing `Z`. Without
        them the response is every dose ever logged, unsorted and uncapped. A bare calendar
        date returns 400. `dateFilterBy` defaults to `EffectiveDate` here (the opposite of
        `get_dose_history`).

        `doseUnit` may be null when the stored unit is a concentration the closed unit list
        cannot express; `strengthUnitCode` then carries it. Report the two together.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: type
          in: query
          required: true
          description: Which category to return. `Medication` or `Supplement`.
          schema:
            type: string
            enum: [Medication, Supplement]
        - name: startDate
          in: query
          description: Window start. UTC timestamp with a trailing `Z`. Always send it.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Window end. UTC timestamp with a trailing `Z`. Always send it.
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          description: Optional filter to one dose status.
          schema:
            type: string
            enum: [Pending, Taken, Skipped]
        - name: dateFilterBy
          in: query
          description: Which date the window applies to. Defaults to `EffectiveDate` (when the dose was taken).
          schema:
            type: string
            enum: [EffectiveDate, ScheduledDate]
            default: EffectiveDate
      responses:
        "200":
          description: Flat dose log rows in the medication-row shape
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineHistoryResponse"
        "400":
          description: Missing requestingUserId, or a date without a UTC designator
        "403":
          description: Caller may not read this user's medications

  /api/v1/user-products/user/{userId}/adherence-stats:
    get:
      tags: [Medications]
      operationId: get_adherence_stats
      summary: Get dose counts by outcome and an adherence rate
      description: |
        Returns counts of a person's doses by outcome (`total`, `taken`, `skipped`, `missed`,
        `pending`) plus `adherenceRate` as a percentage.

        Use when the question is how well someone is keeping to their doses, rather than
        reading every dose through `get_dose_history` and counting.

        `type` is optional. Omit it for one figure covering medications and supplements
        combined, or pass `Medication` or `Supplement` for a single category.

        Always send `startDate` and `endDate` as `yyyy-MM-dd`. The window applies to the day
        each dose was scheduled for; with no dates the counts cover the person's whole
        history. `endDate` is not defaulted, so an open-ended window also counts doses not yet
        due, which land in `pending`.

        `adherenceRate` is taken divided by (total minus pending). It is reported as 0 when
        nothing in the window has resolved yet, so check `total` and `pending` before
        describing a rate of 0 as poor adherence. A skipped dose counts against the rate
        exactly as a missed one does.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/ProductTypeOptionalQuery"
        - name: startDate
          in: query
          description: Window start as `yyyy-MM-dd`, by scheduled day. Always send it.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Window end as `yyyy-MM-dd`, by scheduled day. Always send it; there is no default.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dose counts and adherence rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdherenceStatsResponse"
        "403":
          description: Caller may not read this user's medications
  # ===================
  # NOTE ENDPOINTS
  # ===================
  /api/v1/Notes:
    get:
      tags: [Notes]
      operationId: list_notes
      summary: List clinical notes (provider-facing)
      description: |
        Returns clinical notes for a provider, paged, with title, date, content, categories,
        attached patients, draft state and author.

        Use `patientId` to scope the results to one patient. Without it the tool may return
        notes across the tenant, and the results may belong to unrelated patients.

        Patients should use `get_shared_notes` instead; this is the provider-facing list.

        Drafts are included by default; pass `includeDrafts=false` for finalized notes only.
        `pageNumber` is 0-based and `pageSize` is 1–100, default 20.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: patientId
          in: query
          description: |
            The patient's Arii user ID (GUID). Always send it when the question is about one
            patient. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 20).
          schema:
            type: integer
            default: 20
        - name: includeDrafts
          in: query
          description: Include draft notes (default true).
          schema:
            type: boolean
            default: true
        - name: createdBy
          in: query
          description: Filter by the author's Arii user ID (GUID).
          schema:
            type: string
            format: uuid
        - name: isArchived
          in: query
          description: Filter by archived status.
          schema:
            type: boolean
        - name: search
          in: query
          description: Free text matched against title or content.
          schema:
            type: string
        - name: categories
          in: query
          description: Filter by category names from `list_note_categories`.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Paginated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedNotes"

  /api/v1/Notes/shared:
    get:
      tags: [Notes]
      operationId: get_shared_notes
      summary: Get notes a clinician has shared with the patient
      description: |
        Returns clinical notes that a clinician has shared with the patient, with who shared
        them and when.

        Use for the patient-side view of shared clinical notes. Private and archived notes
        are excluded.

        Returns a plain list, not a page. There is no `pageNumber`.

        An empty result means no notes were shared with the patient. It does not mean the
        patient's chart contains no notes.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: query
          description: Arii user ID (GUID) of the patient whose shared notes to fetch. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of shared notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteDto"

  /api/v1/Notes/{id}:
    get:
      tags: [Notes]
      operationId: get_note
      summary: Get one clinical note by ID
      description: |
        Returns one clinical note in full, including its body, version, draft state,
        categories, sharing state and the patients it is attached to.

        Use only with a note ID returned by `list_notes` or `get_shared_notes` in this
        conversation. Never call it with an ID from anywhere else.

        Returns 404 when the note does not exist.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The note ID (GUID) from `list_notes` or `get_shared_notes`.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDto"
        "404":
          description: No note with that ID

  /api/v1/note-categories:
    get:
      tags: [Notes]
      operationId: list_note_categories
      summary: List the note categories
      description: |
        Returns the platform's note categories, including each category's ID and exact name.

        Use when you need the valid category IDs or exact category names for filtering notes
        with `list_notes`. This catalog is not patient-specific.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of note categories

  # ===================
  # OBSERVATION ENDPOINTS
  # ===================
  /api/v2/Observation:
    get:
      tags: [Observations]
      operationId: list_observations
      summary: List observation events for a user
      description: |
        Returns events in a user's record over a date range, such as lab panels, scans,
        workouts and self-reports, with event type, dates, source, metadata and tags.

        Use to find or identify observations: "when was my last lab draw", "which
        observation ID". Use the marker tools for the measurements inside an observation;
        this tool does not carry values.

        Send `RecordStartDate` and `RecordEndDate` together as `yyyy-MM-dd`. The legacy
        `StartDate`/`EndDate` instants are still accepted and must be UTC with a trailing `Z`.
        Do not drop the date range to work around an error: without a range the tool returns
        the most recent rows, which answers a different question.

        Leave `IncludeHealthKitSamples` false. True repeats every sample of every event with
        nested marker and observation objects and can exceed the context window. For the raw
        samples of an event use `get_observation_samples`.

        `PageNumber` is 0-based and `PageSize` is 1–100, default 10.

        A 400 mentioning "Tenant context required" is a refused cross-user read, not missing
        data. If this read fails, say you could not retrieve the data.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: UserId
          in: query
          description: Arii user ID (GUID) whose observations to list. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: Type
          in: query
          description: "Filter by observation type."
          schema:
            type: string
            enum: [Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery]
        - name: SubType
          in: query
          description: Filter by observation sub-type.
          schema:
            type: string
        - name: Source
          in: query
          description: Filter by data source (exact match, e.g. "Oura", "Fitbit", "Garmin").
          schema:
            type: string
        - name: RecordStartDate
          in: query
          description: Local calendar start day (`yyyy-MM-dd`). Send together with RecordEndDate. Preferred.
          schema:
            type: string
            format: date
        - name: RecordEndDate
          in: query
          description: Local calendar end day (`yyyy-MM-dd`). Send together with RecordStartDate. Preferred.
          schema:
            type: string
            format: date
        - name: StartDate
          in: query
          description: Legacy. Inclusive range start as a UTC timestamp with a trailing `Z`; a value without `Z` returns 400.
          schema:
            type: string
            format: date-time
        - name: EndDate
          in: query
          description: Legacy. Inclusive range end as a UTC timestamp with a trailing `Z`; a value without `Z` returns 400.
          schema:
            type: string
            format: date-time
        - name: PageNumber
          in: query
          description: Page number (0-based).
          schema:
            type: integer
            default: 0
        - name: PageSize
          in: query
          description: Page size (1-100, default 10). Rejected outside that range.
          schema:
            type: integer
            default: 10
        - name: IncludeHealthKitSamples
          in: query
          description: Leave false. True embeds every sample of every listed event and can exceed the context window.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Paginated observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedObservations"
        "400":
          description: Bad date format, page size out of range, or a refused cross-user read ("Tenant context required")

  /api/v2/Observation/{id}:
    get:
      tags: [Observations]
      operationId: get_observation
      summary: Get one observation event by ID
      description: |
        Returns one observation in full by ID, including type, dates, source, metadata and
        tags.

        Use only with an observation ID returned by `list_observations`.

        `sampleCount` reads 0 unless the samples themselves were fetched, so it cannot be
        used to decide whether a panel has results.

        Leave `includeHealthKitSamples` false: a single observation can contain an unbounded
        number of measurements. Use `get_observation_samples` when the underlying samples are
        needed.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The observation ID (GUID) from `list_observations`.
          schema:
            type: string
            format: uuid
        - name: includeHealthKitSamples
          in: query
          description: Leave false. True returns every sample on the event with nested marker and observation objects.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Observation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationDto"

  /api/v3/Observation/healthkit/all-samples:
    get:
      tags: [Observations]
      operationId: get_observation_samples
      summary: Get raw samples with the reference range that applies to this patient
      description: |
        Returns raw measurement samples over a date range, each with the observation it came
        from and `appliedReferenceRange`, the reference range that applies to this patient.

        Use when you need a patient-specific reference range for a named marker: the question
        "is this result normal for this person?". That is what this tool is for.

        It is not the general history path. There is no marker filter, so a broad call
        returns every sample of every marker in the window. Keep the date range tight and
        always set `maxSamplesPerMarker`; for an "is this normal" question, 1 is usually
        right. For a trend use `get_marker_averages`; for a marker's individual readings use
        `get_marker_samples`.

        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`. `userId` is
        optional and defaults to the caller; always send the patient's ID when the question is
        about someone else. `observationTypes` is a comma-separated list of exact type names.

        `appliedReferenceRange` is patient-specific, filtered by sex, and converted to the
        sample's unit. It may be null when no applicable range exists. Do not confuse it with
        `metaData.referenceRange`, which is the range printed on the lab report.

        Samples with no resolved marker type are not returned here, so an unmapped lab
        component visible through `get_observation` may be absent.

        `pageNumber` is 0-based and `pageSize` is 1–1000, default 100.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: userId
          in: query
          description: Arii user ID (GUID) whose samples to read. Defaults to the caller; always send it for another person.
          schema:
            type: string
            format: uuid
        - name: recordStartDate
          in: query
          required: true
          description: Local calendar start day (`yyyy-MM-dd`). Required together with recordEndDate; 400 if either is missing.
          schema:
            type: string
            format: date
        - name: recordEndDate
          in: query
          required: true
          description: Local calendar end day (`yyyy-MM-dd`). Required together with recordStartDate; 400 if either is missing.
          schema:
            type: string
            format: date
        - name: observationTypes
          in: query
          description: "Comma-separated exact observation type names, e.g. `Lab` or `Lab,Scan`. Values: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery."
          schema:
            type: string
        - name: tags
          in: query
          description: Filter by marker type tags.
          schema:
            type: array
            items:
              type: string
        - name: maxSamplesPerMarker
          in: query
          description: Cap on the newest samples returned per marker type. Must be 1 or more. Always set it; 1 for an "is this normal" question.
          schema:
            type: integer
            minimum: 1
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-1000, default 100).
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Paged samples with parent observation and applied reference range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedHealthKitSamples"
        "400":
          description: Missing record date, page out of range, or maxSamplesPerMarker below 1
        "403":
          description: Caller may not read this user's samples

  # ===================
  # DOCUMENT ENDPOINTS (v2)
  # ===================
  /api/v2/Documents:
    get:
      tags: [Documents]
      operationId: get_user_documents
      summary: Get documents on a user's file
      description: |
        Returns documents on a user's file, including name, type, tags, dates, `downloadUrl`,
        the extraction status, and counts of extracted features by review state (total,
        approved, pending, rejected). Those counts say whether extraction is still under
        human review.

        Use to find documents associated with a person.

        Does not return the document's contents, and does not return the extracted values,
        only how many there are. It cannot be used to quote or interpret a report. To read a
        lab's numbers use the marker tools.

        Returns a plain list, not a page. `SelectedUserId` is the owner of the documents.
        `RequestingUserId` is the caller's own Arii user ID from `get_current_user`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: SelectedUserId
          in: query
          required: true
          description: Arii user ID (GUID) whose documents to retrieve. Not an Airia profile ID.
          schema:
            type: string
            format: uuid
        - name: RequestingUserId
          in: query
          description: The caller's own Arii user ID from `get_current_user`. Never the patient's.
          schema:
            type: string
            format: uuid
        - name: documentId
          in: query
          description: Filter to a specific document ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Documents with extraction status and feature counts

  # ===================
  # SYMPTOM ENDPOINTS
  # ===================
  /api/v1/symptoms:
    get:
      tags: [Symptoms]
      operationId: list_symptoms
      summary: List the symptom catalog
      description: |
        Returns the platform's supported symptom catalog, including each symptom's canonical
        ID and name.

        Use before recording a symptom so the stored ID and name come from the platform
        catalog, and to map a person's wording to a canonical symptom.

        This catalog is not patient-specific.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      responses:
        "200":
          description: List of available symptoms

  /api/v1/users/{userId}/symptom-details:
    get:
      tags: [Symptoms]
      operationId: get_user_symptom_details
      summary: Get symptoms recorded by a user
      description: |
        Returns symptoms recorded by a user, including symptom, intensity, start date, end
        date, notes and images. There is no frequency field.

        A missing end date means the symptom is still active.

        `requestingUserId` is required and is the caller's own Arii user ID from
        `get_current_user`, never the patient's.

        Dates must be UTC timestamps such as `2026-08-28T00:00:00Z`. A bare calendar date
        returns 400.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - name: startDate
          in: query
          description: Range start. UTC timestamp with a trailing `Z`; a bare date returns 400.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: Range end. UTC timestamp with a trailing `Z`; a bare date returns 400.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: User symptom details

  # ===================
  # MARKER ENDPOINTS (v2)
  # ===================
  /api/v2/Marker/summary/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_summary
      summary: Get the latest value per marker in a window
      description: |
        Returns the latest value for each marker in a requested time window, including marker
        ID, name, value, unit, record date, category, display precision, data source and the
        user's goal for that marker.

        Use for current or latest marker values, or a named panel of results.

        Scope the call with `specificMarkers`, a list of marker type IDs from
        `bulk_search_marker_types`. Without it the tool returns every marker the person has.

        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`. Omitting
        either returns 400. There is no named window such as `ThirtyDays`; pass the dates.

        `requestingUserId` is required and is the caller's own Arii user ID from
        `get_current_user`. It is not the patient. The patient is the path `userId`.

        If a marker has no reading in the requested window, the tool may return its most
        recent value from up to one year earlier. Always use the returned `recordDate`; do not
        describe a carried-forward value as current. Send `skipFallbackData=true` to receive
        only readings inside the window.

        Does not return reference ranges. For the range that applies to this patient use
        `get_observation_samples`.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiPatientUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - $ref: "#/components/parameters/RecordStartDateRequired"
        - $ref: "#/components/parameters/RecordEndDateRequired"
        - $ref: "#/components/parameters/SpecificMarkers"
        - name: skipFallbackData
          in: query
          description: When true, return only readings inside the window instead of carrying an older value forward. Default false.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One row per marker with its latest value and goal

  /api/v2/Marker/averages/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_averages
      summary: Get trends and statistics for markers over a window
      description: |
        Returns trends for specific markers over a time window, including daily averages,
        per-day values, weekday and weekend averages, highs, lows, the user's goal and the
        individual log readings.

        Use for trends and statistical analysis of named markers.

        First resolve marker names with `bulk_search_marker_types`, then pass the resulting
        marker IDs as `specificMarkers`. Avoid unscoped calls: they can return every marker
        and its full logs.

        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`. Omitting
        either returns 400.

        `requestingUserId` is required and is the caller's own Arii user ID from
        `get_current_user`, never the patient's.

        `pageNumber` is 0-based and `pageSize` is 1–100, default 20. Pages are ordered by
        marker type ID, so a partial page is not necessarily the most relevant subset; read
        every page when the question needs all requested markers.

        Each log may contain `metaData.referenceRange`. This is the range printed on the lab
        report in the reading's stored unit. Report it as stored; do not treat it as a
        patient-specific range or compare converted values to it.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiPatientUserIdPath"
        - $ref: "#/components/parameters/AriiRequestingUserIdQuery"
        - $ref: "#/components/parameters/RecordStartDateRequired"
        - $ref: "#/components/parameters/RecordEndDateRequired"
        - $ref: "#/components/parameters/SpecificMarkers"
        - name: pageNumber
          in: query
          description: Zero-based page number (default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Marker types per page (1-100, default 20).
          schema:
            type: integer
            default: 20
        - name: useWeeklyAggregation
          in: query
          description: Optional override for weekly vs daily chart bucketing. Omit to let the window length decide.
          schema:
            type: boolean
      responses:
        "200":
          description: Paged averages per marker type

  /api/v2/Marker/samples/{userId}:
    get:
      tags: [Markers]
      operationId: get_marker_samples
      summary: Get individual readings for markers over a window
      description: |
        Returns individual readings for a marker over a date range, including value, unit,
        record date, source, timestamps and tags.

        Use for the individual historical readings of a marker: one specific reading, or
        variation within a single day.

        Scope the call with `specificMarkers`, a list of marker type IDs from
        `bulk_search_marker_types`. Without it the tool returns every marker the person has.

        `recordStartDate` and `recordEndDate` are both required as `yyyy-MM-dd`. Omitting
        either returns 400. This tool takes no `requestingUserId`.

        Use `hasNextPage` for paging. `totalCount` and `totalPages` are always 1.

        `metaData.referenceRange` is the range printed on the lab report in the reading's
        stored unit. This tool does not return a patient-specific range; for that use
        `get_observation_samples`.

        If this read fails, say you could not retrieve the data. A failure is never evidence
        that the person has none.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiPatientUserIdPath"
        - $ref: "#/components/parameters/RecordStartDateRequired"
        - $ref: "#/components/parameters/RecordEndDateRequired"
        - $ref: "#/components/parameters/SpecificMarkers"
        - name: pageNumber
          in: query
          description: Zero-based page number (default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Samples per page, 1-1000 (default 100).
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Paginated raw marker samples

  # ===================
  # MARKER TYPE ENDPOINTS (v2)
  # ===================
  /api/v2/MarkerType:
    get:
      tags: [MarkerTypes]
      operationId: list_marker_types
      summary: Search the platform marker catalog
      description: |
        Returns the platform marker catalog with search and paging, including marker name,
        aliases, units, display precision, category and system reference ranges.

        Use when you need to search or inspect marker definitions. To resolve a named metric
        to an ID for the marker tools, prefer `bulk_search_marker_types`.

        Filter with `search`, `name`, `category`, `tags` or `labProvider` rather than paging
        through the catalog.

        `systemReferenceRanges` are platform-level ranges, not patient-specific ranges. Do not
        use them to decide whether a patient's result is normal; use `get_observation_samples`.

        `pageNumber` is 0-based and `pageSize` is 1–100, default 10.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: search
          in: query
          description: Filter by name containing this string.
          schema:
            type: string
        - name: name
          in: query
          description: Exact name filter.
          schema:
            type: string
        - name: category
          in: query
          description: Exact category filter.
          schema:
            type: string
        - name: tenantId
          in: query
          description: Marker types for a specific tenant/group (GUID).
          schema:
            type: string
            format: uuid
        - name: includeDefault
          in: query
          description: Include marker types with no tenantId (system defaults). Default true.
          schema:
            type: boolean
            default: true
        - name: withQuantityType
          in: query
          description: true = only marker types with a QuantityType; false = only those without; omit for both.
          schema:
            type: boolean
        - name: tags
          in: query
          description: Filter by tags.
          schema:
            type: array
            items:
              type: string
        - name: labProvider
          in: query
          description: Filter by lab provider.
          schema:
            type: string
        - name: includeAllTags
          in: query
          description: If true, include all tags in the response.
          schema:
            type: boolean
        - name: excludeCategories
          in: query
          description: Category IDs to exclude from results.
          schema:
            type: array
            items:
              type: string
        - name: pageNumber
          in: query
          description: Page number (0-based, default 0).
          schema:
            type: integer
            default: 0
        - name: pageSize
          in: query
          description: Page size (1-100, default 10).
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Paginated marker types

  /api/v2/MarkerType/lookup:
    post:
      tags: [MarkerTypes]
      operationId: bulk_search_marker_types
      summary: Resolve marker names to marker type IDs
      description: |
        Resolves marker names to marker type IDs. Returns matching marker types grouped per
        keyword, each with ID, canonical name, alternate names and category.

        Use when you have a marker name and need its ID before calling another marker tool.
        Run it once with every metric named in the question.

        Supports up to 200 keywords. Matching is case-insensitive substring matching against
        names, aliases and lab component names. It is not fuzzy matching and does not apply
        synonyms, so use the clinical marker name rather than the user's wording when you can.

        If the same marker name exists for different specimens, the results distinguish them
        by type.

        Results are keyed by the keyword you sent. An empty array for a keyword means the
        catalog has no such marker. It does not mean the patient has no data for it. Do not
        report absence from this tool.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keywords]
              properties:
                keywords:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                  description: Marker names to look up. Up to 200.
                tenantId:
                  type: string
                  format: uuid
                  description: Optional tenant/group ID (GUID) to filter by.
                includeDefault:
                  type: boolean
                  description: Whether to include default (null tenant) marker types. Default true.
      responses:
        "200":
          description: Marker types grouped by keyword

  /api/v2/MarkerType/{id}:
    get:
      tags: [MarkerTypes]
      operationId: get_marker_type
      summary: Get one marker definition by ID
      description: |
        Returns one marker definition by ID, including name, aliases, SI and conventional
        units, the conversion factor between them, LOINC and SNOMED codes, display precision,
        category and system reference ranges.

        Use when you already have a marker type ID and need its definition, unit or display
        precision. Does not return patient values.

        For searching by name, use `bulk_search_marker_types` or `list_marker_types`.

        `systemReferenceRanges` are platform-level ranges, not patient-specific ranges.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - name: id
          in: path
          required: true
          description: The marker type ID (GUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marker type details

  # ===================
  # DATA DICTIONARY ENDPOINTS (v2)
  # ===================
  /api/v2/Users/{userId}/DataDictionary/MarkerTypes:
    get:
      tags: [DataDictionary]
      operationId: get_user_marker_types_with_data
      summary: List the marker types a user has data for
      description: |
        Returns the marker types that have at least one sample in the user's complete
        history, each with ID, name, category, unit and aliases.

        Use to discover which marker data exists for a person. Returns marker types only, not
        values or dates. Results include marker types the dashboard may hide.

        A refused read returns 403. An empty list means the user has no samples.

        For marker values, latest results or panels, pass the IDs to `get_marker_summary` as
        `specificMarkers`.
      x-mcp-annotations:
        readOnlyHint: true
        idempotentHint: true
      parameters:
        - $ref: "#/components/parameters/AriiPatientUserIdPath"
      responses:
        "200":
          description: Marker types the user has data for
        "403":
          description: Caller may not read this user's data

components:
  parameters:
    AriiUserIdPath:
      name: userId
      in: path
      required: true
      description: |
        Arii user ID (v4 GUID, `UserDto.id`) this operation applies to. For the requester's
        own record use `get_current_user`.id; for anyone else, their Arii user ID from
        execution context. Never an Airia profile ID, Keycloak `sub`, or group ID: those
        return 404 "No user found".
      schema:
        type: string
        format: uuid
    AriiPatientUserIdPath:
      name: userId
      in: path
      required: true
      description: |
        Arii user ID (v4 GUID) of the person whose data to read: the patient, from execution
        context. Only use `get_current_user`.id here when the question is about the requester
        themselves. Never an Airia profile ID.
      schema:
        type: string
        format: uuid
    AriiRequestingUserIdQuery:
      name: requestingUserId
      in: query
      required: true
      description: |
        The caller's own Arii user ID: the `id` returned by `get_current_user`. Never the
        patient's ID and never an Airia profile ID. Under Bearer authentication the server
        resolves the caller from the session and ignores this value, but the schema requires one.
      schema:
        type: string
        format: uuid
    RecordStartDateRequired:
      name: recordStartDate
      in: query
      required: true
      description: |
        Start of the window as the person's local calendar date (`yyyy-MM-dd`). Required
        together with recordEndDate; the API returns 400 if either is omitted.
      schema:
        type: string
        format: date
    RecordEndDateRequired:
      name: recordEndDate
      in: query
      required: true
      description: |
        End of the window as the person's local calendar date (`yyyy-MM-dd`). Required
        together with recordStartDate; the API returns 400 if either is omitted.
      schema:
        type: string
        format: date
    SpecificMarkers:
      name: specificMarkers
      in: query
      description: |
        Marker type IDs (GUIDs) from `bulk_search_marker_types` to restrict the read to.
        Omit it and the read covers every marker the person has. Must be non-empty if sent.
      schema:
        type: array
        minItems: 1
        items:
          type: string
          format: uuid
    ProductTypeOptionalQuery:
      name: type
      in: query
      description: Optional category. Omit for medications and supplements together; `Medication` or `Supplement` for one.
      schema:
        type: string
        enum: [Medication, Supplement]

  schemas:
    CurrentUserIdentityDto:
      type: object
      description: |
        Safe identity fields from `get_current_user` (`GET /api/v1/Users/me`).
        Narrower than UserDto — no image, anchors, or sync timestamps.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID of the authenticated caller. Reuse this as `userId` /
            `requestingUserId` / `RequestingUserId` on subsequent Bearer tool calls.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Airia Platform profile ID for correlation only — not valid as Bearer path
            `userId` (profile → Arii translation is API Key only).
        email:
          type: string
          description: Caller's email address
        firstName:
          type: string
          description: Caller's first name
        lastName:
          type: string
          description: Caller's last name
        isVerified:
          type: boolean
          description: Whether the caller's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Caller's active Arii group/organization ID (not a user ID)

    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: |
            Arii user ID — the only GUID valid for path/query `userId`,
            `requestingUserId`, `SelectedUserId`, and `RequestingUserId` under
            Bearer/passthrough auth.
        airiaProfileId:
          type: string
          format: uuid
          description: |
            Linked Airia Platform profile ID. Correlation only — never substitute
            this value for Arii `userId` parameters when using Bearer/passthrough
            (API Key auth may auto-translate on some older endpoints; do not rely
            on that for MCP passthrough).
        firstName:
          type: string
          description: First name
        middleName:
          type: string
          description: Middle name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          description: Email address
        isVerified:
          type: boolean
          description: Whether the user's email is verified
        activeGroupId:
          type: string
          format: uuid
          description: Active group/organization ID (not a user ID)

    UserPreferencesDto:
      type: object
      description: |
        User profile preferences and demographics. Enums are serialized as integers.
        `dateOfBirth` is a calendar date `YYYY-MM-DD` (no time component).
      properties:
        userId:
          type: string
          format: uuid
          description: Arii user ID this preference record belongs to
        firstName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          description: Deprecated full name; prefer firstName/middleName/lastName
        aboutMe:
          type: string
          nullable: true
          description: Free-text "about me" written by the user (max 800 chars)
        sex:
          type: integer
          enum: [0, 1, 2]
          description: "Biological sex: 0=Male, 1=Female, 2=Other"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          description: Date of birth as `YYYY-MM-DD`
        height:
          type: number
          nullable: true
          description: Height in `heightUnit`
        heightUnit:
          type: string
          nullable: true
          description: Unit for `height` (e.g. `cm`, `in`)
        weight:
          type: number
          nullable: true
          description: Weight in `weightUnit`
        weightUnit:
          type: string
          nullable: true
          description: Unit for `weight` (e.g. `kg`, `lb`)
        phone:
          type: string
          nullable: true
        useMetricSystem:
          type: boolean
          description: True if the user prefers metric units
        timeZoneIdentifier:
          type: string
          description: IANA time zone (e.g. `America/New_York`). Use it when interpreting local dates.
        preferredDataSource:
          type: integer
          description: |
            Preferred health data source: 0=Arii, 1=Fitbit, 2=Oura, 3=Withings,
            4=AppleHealth, 5=Garmin, 6=Whoop, 7=BioStrap, 8=Strava, 9=HealthConnect,
            10=Elation, 11=FreeStyleLibre, 12=Cronometer, 13=Mira, 14=Dexcom, 15=Polar,
            16=Omron, 17=HeartMath, 18=InBody, 19=Cerbo, 20=AdvancedMd, 21=OneUpHealth,
            22=JunctionLabReport, 23=Kardia, 24=Peloton, 25=Healthie, 26=Athena,
            27=HeadsUpV1, 28=HumanApi
        preferredDataSourceName:
          type: string
          nullable: true
          description: Human-readable preferred data source (e.g. `Fitbit`). Prefer this over the integer.
        tone:
          type: integer
          description: |
            Preferred AI response tone: 0=ConciseAndFormal, 1=ModerateAndFormal,
            2=LengthyAndFormal, 3=ConciseAndBalanced, 4=ModerateAndBalanced,
            5=LengthyAndBalanced, 6=ConciseAndCasual, 7=ModerateAndCasual, 8=LengthyAndCasual
        isFollowUp:
          type: boolean
          description: Whether the user wants follow-up questions
        shareLocation:
          type: integer
          description: "Location sharing: 0=AllowOnce, 1=AllowWhileUsingApp, 2=NotAllowed"
        isShareAppleHealth:
          type: boolean
          nullable: true
        isShareAppleHealthClinical:
          type: boolean
          nullable: true
        onboardingFlow:
          type: integer
          nullable: true
          description: "0=Provider, 1=TeamMember, 2=PatientViaInvitationToken, 3=PatientViaGroupCode, 4=StandalonePatient"
        allergies:
          type: array
          nullable: true
          description: Known allergies
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              allergy:
                type: integer
                description: Allergy type enum (integer)
              allergyName:
                type: string
                nullable: true
                description: Human-readable allergy name
              otherAllergies:
                type: array
                nullable: true
                items:
                  type: string
              description:
                type: string
                nullable: true
              source:
                type: string
                nullable: true
        dietaryPreferences:
          type: array
          nullable: true
          description: Dietary preferences / restrictions
          items:
            type: object
            properties:
              preference:
                type: integer
                description: Dietary preference enum (integer)
              userDefinedPreferences:
                type: array
                nullable: true
                items:
                  type: string
        goals:
          type: array
          nullable: true
          description: Health goals selected by the user
          items:
            type: object
            properties:
              goalId:
                type: string
                format: uuid
              name:
                type: string
              description:
                type: string
                nullable: true
              userDefinedGoals:
                type: array
                nullable: true
                items:
                  type: string
        preferredDrinkSizes:
          type: array
          items:
            type: integer
          description: Preferred drink sizes in `drinkSizeUnit`
        drinkSizeUnit:
          type: string
        selectedDrinkSizeValue:
          type: number
          nullable: true
        selectedDrinkSizeUnit:
          type: string
          nullable: true

    JournalDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Journal entry ID
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.
        title:
          type: string
          description: Journal title
        content:
          type: string
          description: Journal content
        journalDate:
          type: string
          format: date-time
          description: Date of the journal event
        imageUrls:
          type: array
          items:
            type: string
          description: URLs of attached images
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MealDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Meal ID
        name:
          type: string
          description: Meal name
        description:
          type: string
          description: Meal description
        date:
          type: string
          format: date-time
          description: Meal date
        portionSize:
          type: integer
          description: Number of servings
        servingSizeImperial:
          type: number
          description: Imperial serving size
        servingUnitImperial:
          type: string
          description: Imperial serving unit
        servingSizeMetric:
          type: number
          description: Metric serving size
        servingUnitMetric:
          type: string
          description: Metric serving unit

    NoteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Note ID
        title:
          type: string
          description: Note title
        date:
          type: string
          format: date-time
          description: Note date
        content:
          type: string
          description: Note content (may be HTML or plain text)
        private:
          type: boolean
          description: Whether the note is private
        archived:
          type: boolean
          description: Whether the note is archived
        isDraft:
          type: boolean
          description: Whether this is a draft
        createdBy:
          type: string
          format: uuid
          description: Creator user ID
        tenantId:
          type: string
          format: uuid
          description: Tenant/organization ID
        patientIds:
          type: array
          items:
            type: string
            format: uuid
          description: Associated patient IDs
        categories:
          type: array
          items:
            type: string
          description: Category names
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedNotes:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteDto"
        totalCount:
          type: integer
          description: Total items across all pages
        pageNumber:
          type: integer
          description: Current page (0-based)
        pageSize:
          type: integer
          description: Items per page
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    ObservationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Observation ID
        type:
          type: string
          description: "Observation type: Lab, DeviceTracking, SelfReported, Scan, Exam, Activity, DailySummary, SleepSummary, HrvSummary, Other, LifestyleHabit, Procedure, Condition, Assessment, Appointment, BodyCompositionSummary, Recovery"
        subType:
          type: string
          description: Observation sub-type
        date:
          type: string
          format: date-time
          description: |
            Observation date. List order is undocumented — sort by this field
            descending to find the newest panel, and always report it with values.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        source:
          type: string
          description: Data source
        annotations:
          type: string
          description: Additional annotations
        userId:
          type: string
          format: uuid
          description: |
            Arii user ID (`UserDto.id` GUID) that this record belongs to. For yourself,
            use `get_current_user`.id. Never an Airia profile ID (`airiaProfileId`) or
            Keycloak `sub` — a wrong ID kind writes to the wrong record or 404s.
        tenantId:
          type: string
          format: uuid
          description: Tenant ID
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
        tags:
          type: array
          items:
            type: string
          description: Tags for categorization
        sampleCount:
          type: integer
          description: Count of associated HealthKit samples
        healthKitSamples:
          type: array
          items:
            type: object
          description: |
            Quantity samples carrying numeric lab/device values. Present only when
            `includeHealthKitSamples=true` (avoid enabling). For current lab values
            use `get_marker_summary` with `specificMarkers`, not this array.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagedObservations:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObservationDto"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean

    UserProductPrescriptionResponse:
      type: object
      description: One medication or supplement on a person's record. Enum fields are serialized as names.
      properties:
        id:
          type: string
          format: uuid
          description: Prescription ID
        userId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        productType:
          type: string
          enum: [Medication, Supplement]
        displayName:
          type: string
          description: The name to show for this item
        productLineageId:
          type: string
          format: uuid
        nickname:
          type: string
          nullable: true
        formType:
          type: string
          description: Dosage form, e.g. Tablet, Capsule, Liquid, Injection, Topical, Patch, Inhaler, Drops, Gummy.
        strengthValue:
          type: number
          description: Strength per unit of form. Report together with strengthUnitCode.
        strengthUnitCode:
          type: string
          description: Free-text unit code; can be a concentration such as mg/mL.
        strengthUnitDisplay:
          type: string
          nullable: true
        doseQuantity:
          type: number
          description: How many units of form per dose
        doseQuantityUnitCode:
          type: string
          nullable: true
        doseQuantityUnitDisplay:
          type: string
          nullable: true
        sendReminders:
          type: boolean
        instructions:
          type: string
          nullable: true
        status:
          type: string
          enum: [Active, OnHold, Completed, Stopped, Superseded, EnteredInError]
          description: Read this on every row. Only Active items are currently taken.
        notes:
          type: string
          nullable: true
        schedule:
          $ref: "#/components/schemas/UserProductScheduleResponse"
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the item stopped being in use, for anything no longer Active
        imageUrl:
          type: string
          nullable: true
        todayHistory:
          type: array
          description: Today's dose logs for this item. Empty does not mean nothing was scheduled.
          items:
            $ref: "#/components/schemas/AdherenceLogResponse"

    UserProductScheduleResponse:
      type: object
      description: How an item is scheduled.
      properties:
        id:
          type: string
          format: uuid
        scheduleType:
          type: string
          enum: [Everyday, OnCycle, SpecificDays, EveryFewDays, AsNeeded]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        cycleUnit:
          type: string
          nullable: true
        useForValue:
          type: integer
          nullable: true
        pauseForValue:
          type: integer
          nullable: true
        daysBetweenEvents:
          type: integer
          nullable: true
        schedulePreference:
          type: string
          nullable: true
        selectedDays:
          type: array
          nullable: true
          items:
            type: string
        daySpecificSchedules:
          type: object
          nullable: true
          additionalProperties: true
        scheduleTimes:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true

    AdherenceLogResponse:
      type: object
      description: One scheduled dose. Enum fields are serialized as names.
      properties:
        id:
          type: string
          format: uuid
          description: Dose log ID
        userProductPrescriptionId:
          type: string
          format: uuid
        productLineageId:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
        productType:
          type: string
          enum: [Medication, Supplement]
        formType:
          type: string
        strengthValue:
          type: number
        strengthUnitCode:
          type: string
        doseQuantity:
          type: number
        scheduledDate:
          type: string
          format: date
          description: The day the dose was due (`yyyy-MM-dd`)
        scheduledTime:
          type: string
          description: Clock time the dose was due
        status:
          type: string
          enum: [Pending, Taken, Skipped, Missed]
          description: Pending = still due; Missed = past its grace period
        takenAt:
          type: string
          format: date-time
          nullable: true
          description: When the dose was actually taken, if it was
        notes:
          type: string
          nullable: true
        prescriptionStatus:
          type: string
          enum: [Active, OnHold, Completed, Stopped, Superseded, EnteredInError]
        instructions:
          type: string
          nullable: true
        schedule:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserProductScheduleResponse"

    HistoryResponse:
      type: object
      description: Doses grouped by the day they were scheduled for.
      properties:
        logsByDate:
          type: object
          description: Map of `yyyy-MM-dd` to the doses scheduled that day
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AdherenceLogResponse"

    MedicineHistoryResponse:
      type: object
      description: |
        One scheduled dose in the legacy medication-row shape. This is the row a medication
        card is built from; every card field comes from here. Enum fields are serialized as names.
      properties:
        id:
          type: string
          format: uuid
          description: Dose log ID
        medicationId:
          type: string
          format: uuid
        medicationName:
          type: string
        medicationType:
          type: string
          description: Dosage form
        doseValue:
          type: number
        doseUnit:
          type: string
          nullable: true
          description: Null when the stored unit is a concentration the closed list cannot express; see strengthUnitCode
        strengthUnitCode:
          type: string
          nullable: true
        scheduledDate:
          type: string
          format: date-time
        scheduledTime:
          type: string
        numberOfDoses:
          type: integer
        status:
          type: string
          enum: [Pending, Taken, Skipped]
        takenAt:
          type: string
          format: date-time
          nullable: true
        scheduleType:
          type: string
          enum: [Everyday, OnCycle, SpecificDays, EveryFewDays, AsNeeded]
        note:
          type: string
          nullable: true
        isActive:
          type: boolean
        schedule:
          type: object
          nullable: true
          additionalProperties: true
        instructions:
          type: string
          nullable: true

    AdherenceStatsResponse:
      type: object
      description: Dose counts by outcome for a window.
      properties:
        total:
          type: integer
        taken:
          type: integer
        skipped:
          type: integer
        missed:
          type: integer
        pending:
          type: integer
          description: Doses not yet due or not yet resolved
        adherenceRate:
          type: number
          description: Percentage, taken divided by (total minus pending). 0 when nothing has resolved yet.

    AppliedReferenceRange:
      type: object
      nullable: true
      description: The reference range that applies to this patient, filtered by sex and converted to the sample's unit.
      properties:
        rangeId:
          type: string
          format: uuid
        source:
          type: integer
          description: "Tier the range came from, as an integer: 0=Platform, 1=Org, 2=Cohort, 3=Patient"
        cohortId:
          type: string
          format: uuid
          nullable: true
        cohortName:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
          description: Unit of the segments; matches the sample's unit
        segments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              min:
                type: number
                nullable: true
              max:
                type: number
                nullable: true
              operator:
                type: string
                nullable: true
              label:
                type: string
              gender:
                type: string
                nullable: true

    HealthKitQuantitySampleDto:
      type: object
      description: One raw measurement with its parent observation and the range that applies to this patient.
      properties:
        id:
          type: string
          format: uuid
        value:
          type: number
        unit:
          type: string
          nullable: true
        canonicalUnit:
          type: string
          nullable: true
        secondValue:
          type: number
          nullable: true
        secondUnit:
          type: string
          nullable: true
        textValue:
          type: string
          nullable: true
        isTextResult:
          type: boolean
        recordDate:
          type: string
          format: date
          description: The person's local calendar date of the reading
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        observationId:
          type: string
          format: uuid
          nullable: true
        observation:
          nullable: true
          description: The event this sample came from (ID, type, dates, source, metadata)
          allOf:
            - $ref: "#/components/schemas/ObservationDto"
        markerTypeId:
          type: string
          format: uuid
          nullable: true
        markerType:
          type: object
          nullable: true
          additionalProperties: true
        panel:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        metaData:
          type: object
          nullable: true
          additionalProperties: true
          description: May include referenceRange, the range printed on the lab report. Not patient-specific.
        appliedReferenceRange:
          $ref: "#/components/schemas/AppliedReferenceRange"
        systemReferenceRangeId:
          type: string
          format: uuid
          nullable: true
        dataSourceName:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        originalSource:
          type: string
          nullable: true

    PagedHealthKitSamples:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HealthKitQuantitySampleDto"
        totalCount:
          type: integer
        pageNumber:
          type: integer
        pageSize:
          type: integer

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: |
        API Key via X-API-Key. Some older endpoints may auto-translate Airia profile IDs
        to Arii user IDs under API Key auth only. Prefer explicit Arii user IDs; several
        newer endpoints do not support API Key at all.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer (including Airia Platform passthrough). Requires Arii user IDs in all
        user-scoped parameters — no Airia-profile→Arii-user auto-translation.
